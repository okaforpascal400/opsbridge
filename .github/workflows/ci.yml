name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opsbridge
          POSTGRES_PASSWORD: opsbridge
          POSTGRES_DB: opsbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsbridge -d opsbridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          DATABASE_URL: postgresql+psycopg2://opsbridge:opsbridge@localhost:5432/opsbridge
          # The service container above is torn down with the job, so it is safe
          # to point the database-backed tests at it even though the seed drops
          # and recreates the legacy schema.
          OPSBRIDGE_TEST_DATABASE_URL: postgresql+psycopg2://opsbridge:opsbridge@localhost:5432/opsbridge
        run: pytest

      # The golden expectations are counts read from the real seed, so the evals need a
      # database in a known state. The tests seed as a side effect, but relying on which
      # test ran last would make the evals depend on collection order, so seed explicitly.
      - name: Seed the database for the evals
        env:
          DATABASE_URL: postgresql+psycopg2://opsbridge:opsbridge@localhost:5432/opsbridge
        run: python -m legacy.seed_db

      # The deterministic suite only: it calls no model, so it is free and reproducible,
      # and it exits non-zero on any failed case, which fails the build. evals/live.py is
      # deliberately not run here; it needs an API key and is non-deterministic.
      - name: Evals
        env:
          DATABASE_URL: postgresql+psycopg2://opsbridge:opsbridge@localhost:5432/opsbridge
        run: python -m evals.run
